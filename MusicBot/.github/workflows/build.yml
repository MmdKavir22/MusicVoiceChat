name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "26.2"
            fabric_api: "0.161.0+26.2"
          - mc: "26.3"
            fabric_api: "0.163.0+26.3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build --no-daemon -Pminecraft_version=${{ matrix.mc }} -Pfabric_version=${{ matrix.fabric_api }}

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MusicBot-Minecraft-${{ matrix.mc }}-Fabric
          path: |
            build/libs/MusicBot-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
